<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" font-family="Cantarell, 'Inter', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="v1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6a35c"/><stop offset="1" stop-color="#c64600"/></linearGradient>
    <linearGradient id="v2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62a0ea"/><stop offset="1" stop-color="#1a5fb4"/></linearGradient>
    <g id="arrows">
      <circle cx="0" cy="-15" r="9" fill="#fff" opacity="0.9"/><path d="M-4 -13l4-4 4 4" fill="none" stroke="#3d3846" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="15" r="9" fill="#fff" opacity="0.9"/><path d="M-4 13l4 4 4-4" fill="none" stroke="#3d3846" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="780" height="340" rx="18" fill="#2b2a33"/>
  <g font-size="15" fill="#e8e6e3" text-anchor="middle" font-weight="bold">
    <text x="130" y="40">1. Leave TikTok</text><text x="390" y="40">2. ↑ ↓ for the next one</text><text x="650" y="40">3. Back on TikTok</text>
  </g>
  <g font-size="12.5" fill="#a9a7a4" text-anchor="middle">
    <text x="130" y="306">Another tab, another desktop,</text><text x="130" y="324">minimized or covered: PiP</text>
    <text x="390" y="306">Click it, then ↑ / ↓, or the</text><text x="390" y="324">buttons. The same window stays</text>
    <text x="650" y="306">The PiP closes and the video</text><text x="650" y="324">goes on in the page</text>
  </g>

  <!-- 1: a browser on another tab, the video floats on top -->
  <rect x="22" y="58" width="216" height="220" rx="12" fill="#3a3842"/>
  <rect x="34" y="70" width="192" height="150" rx="8" fill="#ececec"/>
  <rect x="34" y="70" width="192" height="24" rx="8" fill="#d6d6d6"/>
  <rect x="40" y="76" width="56" height="14" rx="4" fill="#bdbdbd"/><rect x="100" y="76" width="56" height="14" rx="4" fill="#fafafa"/>
  <g fill="#c0bfbc"><rect x="46" y="108" width="150" height="8" rx="4"/><rect x="46" y="124" width="120" height="8" rx="4"/><rect x="46" y="140" width="136" height="8" rx="4"/><rect x="46" y="156" width="96" height="8" rx="4"/></g>
  <rect x="160" y="150" width="62" height="110" rx="8" fill="url(#v1)" stroke="#ff5e7e" stroke-width="2.5"/>
  <circle cx="191" cy="190" r="12" fill="#fff" opacity="0.85"/><path d="M186 183v14l11-7z" fill="#c64600"/>

  <!-- 2: the PiP up close, with ▲ ▼ -->
  <rect x="282" y="58" width="216" height="220" rx="12" fill="#3a3842"/>
  <rect x="340" y="68" width="100" height="200" rx="10" fill="url(#v2)" stroke="#ff5e7e" stroke-width="2.5"/>
  <circle cx="390" cy="160" r="16" fill="#fff" opacity="0.85"/><path d="M384 151v18l14-9z" fill="#1a5fb4"/>
  <use href="#arrows" x="424" y="168"/>
  <g fill="#e8e6e3" font-size="12" text-anchor="middle">
    <rect x="300" y="138" width="26" height="24" rx="5" fill="#5e5c64"/><text x="313" y="155">↑</text>
    <rect x="300" y="168" width="26" height="24" rx="5" fill="#5e5c64"/><text x="313" y="185">↓</text>
  </g>

  <!-- 3: back on the TikTok tab, the video plays in the page -->
  <rect x="542" y="58" width="216" height="220" rx="12" fill="#3a3842"/>
  <rect x="554" y="70" width="192" height="150" rx="8" fill="#121212"/>
  <rect x="554" y="70" width="192" height="24" rx="8" fill="#2d2d2d"/>
  <rect x="560" y="76" width="56" height="14" rx="4" fill="#4a4a4a"/><rect x="620" y="76" width="56" height="14" rx="4" fill="#202020"/>
  <rect x="624" y="100" width="54" height="114" rx="6" fill="url(#v2)"/>
  <circle cx="651" cy="157" r="11" fill="#fff" opacity="0.85"/><path d="M647 151v12l10-6z" fill="#1a5fb4"/>
  <use href="#arrows" x="728" y="157"/>
</svg>
