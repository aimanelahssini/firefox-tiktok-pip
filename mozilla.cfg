// tiktok-pip: Firefox's autoconfig, installed by firefox-tiktok-pip because there was none.
// >>> autoconfig.d: loads every folder in Firefox's autoconfig.d/ (TikTok picture-in-picture
// lives in autoconfig.d/tiktok-pip). Each folder becomes resource://<folder>/ and its
// main.sys.mjs runs once at startup.
try {
  const dir = Services.dirsvc.get("GreD", Components.interfaces.nsIFile);
  dir.append("autoconfig.d");
  if (dir.exists()) {
    const res = Services.io.getProtocolHandler("resource")
      .QueryInterface(Components.interfaces.nsIResProtocolHandler);
    for (const sub of dir.directoryEntries) {
      try {
        if (!sub.isDirectory()) continue;
        res.setSubstitution(sub.leafName, Services.io.newFileURI(sub));
        ChromeUtils.importESModule(`resource://${sub.leafName}/main.sys.mjs`).init();
      } catch (e) {
        Components.utils.reportError(e);
      }
    }
  }
} catch (e) {
  Components.utils.reportError(e);
}
// <<< autoconfig.d
